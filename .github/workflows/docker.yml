name: Docker

# Proves the image builds. It carries CUDA, PyTorch and ComfyUI, so it is large and slow -- but "it has never been
# built" is not a state to ship packaging in, and a static check of a Dockerfile proves nothing about whether the
# .NET runtime install in the final stage actually resolves.
on:
  push:
    branches: ['**']
    paths:
      - 'Dockerfile*'
      - 'compose.yml'
      - 'docker/**'
      - 'comfy-nodes/**'
      - 'comfy-patches/**'
      - 'src/**'
      - 'tools/ComfyPatch/**'
      - '.github/workflows/docker.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: docker build (${{ matrix.gpu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gpu: nvidia
            dockerfile: Dockerfile
          - gpu: amd
            dockerfile: Dockerfile.rocm
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk
        # A stock runner has nowhere near enough free space for CUDA + torch + ComfyUI. These are the largest
        # preinstalled toolchains and none of them is used by this build.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: imagegen:ci-${{ matrix.gpu }}
          cache-from: type=gha,scope=${{ matrix.gpu }}
          cache-to: type=gha,mode=max,scope=${{ matrix.gpu }}

      - name: Report
        if: always()
        run: df -h /
