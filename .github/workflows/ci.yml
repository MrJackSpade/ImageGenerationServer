name: CI

# Build and test every push. The analyzers are errors, so a green run here also means the doc comments and the
# provider-neutral database reads are intact -- neither is checkable by reading a diff.
on:
  push:
    # main is excluded on purpose: this repo commits straight to main, and a release/test tag build pushes main as a
    # side effect — running CI + Docker on every such push starved the tag build of hosted runners. CI runs on other
    # branches, pull requests, and manual dispatch; a main change is validated via the tag build (and locally).
    branches: ['**', '!main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    name: build + test (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ImageGen.slnx
      - run: dotnet build ImageGen.slnx -c Release --no-restore
      - run: dotnet test tests/ImageGen.Tests -c Release --no-build

  sqlserver:
    # The same tests against a real SQL Server. "Runs on either engine" is a claim, and the only proof of it is
    # the identical suite passing on both -- half the landmines in ARCHITECTURE.md section 6.2 are invisible on
    # whichever engine you did not run.
    name: build + test (SQL Server)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Str0ng!Passw0rd'
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Str0ng!Passw0rd' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ImageGen.slnx
      - run: dotnet build ImageGen.slnx -c Release --no-restore
      - run: dotnet test tests/ImageGen.Tests -c Release --no-build
        env:
          IMAGEGEN_TEST_SQLSERVER: '1'
          IMAGEGEN_TEST_SQLSERVER_MASTER: 'Server=localhost,1433;Database=master;User Id=sa;Password=Str0ng!Passw0rd;TrustServerCertificate=true'
          IMAGEGEN_TEST_SQLSERVER_DB: 'Server=localhost,1433;Database=ImageGenTest;User Id=sa;Password=Str0ng!Passw0rd;TrustServerCertificate=true'
